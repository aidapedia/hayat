# `make generate` runs this. Generated code is committed, so building Hayat
# never needs buf or the plugins.
version: v2
clean: true
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: gen/go
    opt: paths=source_relative
  - local: console/node_modules/.bin/protoc-gen-es
    out: console/src/shared/api/gen
    opt: target=ts
  - local: console/node_modules/.bin/protoc-gen-es
    out: sdk/node/src/gen
    opt:
      - target=ts
      - import_extension=js
