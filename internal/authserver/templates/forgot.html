{{define "content"}}
<form method="post" action="/forgot" class="form" novalidate>
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <label class="field">
    <span>Email</span>
    <input type="email" name="email" value="{{.Email}}" autocomplete="email" required autofocus>
  </label>
  <button type="submit" class="btn">Email me a reset link</button>
</form>
{{end}}
{{define "foot"}}Remembered it? <a href="/login">Sign in</a>{{end}}
