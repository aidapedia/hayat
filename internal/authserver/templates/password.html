{{define "content"}}
<form method="post" action="{{.Action}}" class="form" novalidate>
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <input type="hidden" name="r" value="{{.Region}}">
  <input type="hidden" name="t" value="{{.Token}}">
  {{if .Email}}<input type="email" name="email" value="{{.Email}}" autocomplete="username" hidden>{{end}}
  <label class="field">
    <span>New password</span>
    <input type="password" name="password" autocomplete="new-password" minlength="{{.MinLength}}" required autofocus>
  </label>
  <label class="field">
    <span>Repeat password</span>
    <input type="password" name="confirm" autocomplete="new-password" minlength="{{.MinLength}}" required>
  </label>
  <p class="hint">At least {{.MinLength}} characters. A short sentence is easier to remember than a jumble.</p>
  <button type="submit" class="btn">{{.Button}}</button>
</form>
{{end}}
