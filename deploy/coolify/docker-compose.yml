# Hayat on Coolify, built from this repository's source — no published image.
#
# Coolify: New Resource → Git repository (this repo, any branch) → Build Pack
# "Docker Compose" → Base Directory "/deploy/coolify" → Docker Compose Location
# "/docker-compose.yml". (Coolify resolves the build contexts below from the
# Base Directory; with "/" the "../.." would climb out of the repo.) Then, per
# service, either set a domain in Coolify:
#   hayat-auth     https://auth.example.com:8443   (the issuer; public)
#   hayat-console  https://hayat.example.com:80    (optional console)
# (the ":port" tells Coolify's proxy which container port to use), or — behind
# a Cloudflare Tunnel with cloudflared on this host — leave the domains empty
# and point the tunnel's public hostnames at the ports published on 127.0.0.1:
#   auth.example.com  → http://localhost:8443   (HAYAT_AUTH_PORT, default 8443)
#   hayat.example.com → http://localhost:3000   (HAYAT_CONSOLE_PORT, default 3000)
# Leave hayat-admin and hayat-api unpublished either way.
#
# Required variables (Coolify lists them under Environment Variables):
#   HAYAT_MASTER_KEY   openssl rand -base64 32 — keep a copy; losing it means re-issuing every key
#   HAYAT_ISSUER       https://auth.example.com (the hayat-auth domain, no port)
#   HAYAT_CONSOLE_URL  https://hayat.example.com (the hayat-console domain)
#   HAYAT_SMTP_URL     smtp://user:pass@smtp.example.com:587
# The PostgreSQL password is generated by Coolify (SERVICE_PASSWORD_POSTGRES).
#
# Data lives on the server under /mnt/data/hayat (bind mounts, not Docker
# volumes). Create the media directory once before the first deploy — Hayat
# runs as uid 65532 and must be able to write there:
#   sudo mkdir -p /mnt/data/hayat/postgres /mnt/data/hayat/media
#   sudo chown 65532:65532 /mnt/data/hayat/media
# Back up both directories together.
#
# First admin: open hayat-auth's logs and look for the setup link, or run
# `hayat setup-link` in its terminal.

x-hayat: &hayat
  # Every role builds the same Dockerfile; after the first build the rest come
  # from the build cache.
  build:
    context: ../..
    args:
      VERSION: ${SOURCE_COMMIT:-dev}
  restart: unless-stopped
  environment:
    HAYAT_MASTER_KEY: ${HAYAT_MASTER_KEY:?}
    HAYAT_ISSUER: ${HAYAT_ISSUER:?}
    HAYAT_CONSOLE_URL: ${HAYAT_CONSOLE_URL:?}
    HAYAT_DEV: "false"
    HAYAT_REGION: ${HAYAT_REGION:-default}
    HAYAT_DATABASE_ENGINE: postgres
    HAYAT_DATABASE_URL: postgres://hayat:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/hayat?sslmode=disable
    HAYAT_REDIS_URL: redis://redis:6379/0
    HAYAT_SMTP_URL: ${HAYAT_SMTP_URL:?}
    HAYAT_MAIL_FROM: ${HAYAT_MAIL_FROM:-Hayat <no-reply@example.com>}
    HAYAT_STORAGE: ${HAYAT_STORAGE:-local}
    HAYAT_STORAGE_DIR: /var/lib/hayat/media
    HAYAT_S3_ENDPOINT: ${HAYAT_S3_ENDPOINT:-}
    HAYAT_S3_REGION: ${HAYAT_S3_REGION:-}
    HAYAT_S3_BUCKET: ${HAYAT_S3_BUCKET:-}
    HAYAT_S3_PREFIX: ${HAYAT_S3_PREFIX:-}
    HAYAT_S3_ACCESS_KEY_ID: ${HAYAT_S3_ACCESS_KEY_ID:-}
    HAYAT_S3_SECRET_ACCESS_KEY: ${HAYAT_S3_SECRET_ACCESS_KEY:-}
    HAYAT_S3_PATH_STYLE: ${HAYAT_S3_PATH_STYLE:-false}
    HAYAT_TURNSTILE_SITE_KEY: ${HAYAT_TURNSTILE_SITE_KEY:-}
    HAYAT_TURNSTILE_SECRET_KEY: ${HAYAT_TURNSTILE_SECRET_KEY:-}
  volumes:
    - /mnt/data/hayat/media:/var/lib/hayat/media
  depends_on:
    hayat-migrate:
      condition: service_completed_successfully
    redis:
      condition: service_started

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: hayat
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: hayat
    volumes:
      - /mnt/data/hayat/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hayat"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4
    restart: unless-stopped

  hayat-migrate:
    <<: *hayat
    restart: "no"
    command: ["migrate"]
    exclude_from_hc: true # one-shot: exits 0 after migrating, Coolify shouldn't call that unhealthy
    depends_on:
      postgres:
        condition: service_healthy

  hayat-auth:
    <<: *hayat
    command: ["serve", "--role=auth"]
    ports: ["127.0.0.1:${HAYAT_AUTH_PORT:-8443}:8443"] # cloudflared: auth.<domain> → http://localhost:<HAYAT_AUTH_PORT>

  hayat-admin:
    <<: *hayat
    command: ["serve", "--role=admin"]

  hayat-api:
    <<: *hayat
    command: ["serve", "--role=api"]

  hayat-worker:
    <<: *hayat
    command: ["serve", "--role=worker"]

  hayat-console:
    build:
      context: ../../console
    restart: unless-stopped
    environment:
      HAYAT_ADMIN_URL: http://hayat-admin:8080
    ports: ["127.0.0.1:${HAYAT_CONSOLE_PORT:-3000}:80"] # cloudflared: hayat.<domain> → http://localhost:<HAYAT_CONSOLE_PORT>
    depends_on: [hayat-admin]
